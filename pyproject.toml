# Build System
[build-system]
requires = ["setuptools>=70", "wheel", "cffi>=2.0"]
build-backend = "setuptools.build_meta"

# Project Metadata
[project]
name = "alkindi"
version = "0.0.1"
description = "Python bindings for NIST-standardized post-quantum cryptography, powered by OpenSSL. Honoring Al-Kindi, the 9th-century pioneer of cryptography."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Khalid Alraddady" }]

keywords = [
    "cryptography", "post-quantum", "quantum-resistant",
    "ML-KEM", "ML-DSA", "SLH-DSA",
    "FIPS-203", "FIPS-204", "FIPS-205",
    "OpenSSL", "PQC", "Kyber", "Dilithium", "Sphincs+"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = ["cffi>=2.0"]

# Optional Dependencies
[project.optional-dependencies]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

# Testing only
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
]

# Linting and type checking
lint = [
    "mypy>=1.0",
    "ruff>=0.1.0",
]

all = ["alkindi[dev,test,lint]"]

# Project URLs
[project.urls]
Homepage = "https://github.com/alraddady/alkindi"
Repository = "https://github.com/alraddady/alkindi"
Issues = "https://github.com/alraddady/alkindi/issues"
Documentation = "https://github.com/alraddady/alkindi#readme"

# Tool: Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",                    # Verbose output
    "--strict-markers",      # Error on unknown markers
    "--tb=short",           # Short traceback format
    "--cov=src/alkindi",    # Coverage for main package
    "--cov-report=term-missing",  # Show missing lines
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fuzzing: marks tests as fuzzing tests",
    "nist: marks tests using NIST test vectors",
]

# Tool: Coverage
[tool.coverage.run]
source = ["src/alkindi"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/bindings.py",  # CFFI-generated, skip coverage
]
branch = true  # Measure branch coverage

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",  # Ellipsis
]

# Tool: MyPy
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "_alkindi_"
ignore_missing_imports = true

# Tool: Ruff
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests