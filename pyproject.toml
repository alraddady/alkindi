[build-system]
requires = ["setuptools>=70", "wheel", "cffi>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alkindi"
version = "0.0.2"
description = "Python bindings for NIST-standardized post-quantum cryptography, powered by OpenSSL. Honoring Alkindi, the 9th-century pioneer of cryptography."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Khalid Alraddady" }]

dependencies = ["cffi>=2.0"]

[project.urls]
Repository = "https://github.com/alraddady/alkindi"
Issues = "https://github.com/alraddady/alkindi/issues"
Documentation = "https://github.com/alraddady/alkindi#readme"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alkindi = ["py.typed"]
