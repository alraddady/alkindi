name: Build and Publish Wheels

on:
  workflow_dispatch:
    inputs:
      publish-to-pypi:
        description: "Publish to PyPI after successful build?"
        type: boolean
        default: false

      publish-to-testpypi:
        description: "Publish to TestPyPI after successful build?"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04, arch: aarch64 }
          - { os: macos-26, arch: arm64 }
          - { os: windows-2025, arch: AMD64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up QEMU for Linux ARM64
        if: matrix.arch == 'aarch64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_IMAGE: manylinux_2_28

          CIBW_BEFORE_ALL_LINUX: yum install -y perl-IPC-Cmd perl-Locale-Maketext-Simple perl-Time-Piece perl-core || true && bash {project}/scripts/build_openssl.sh
          CIBW_BEFORE_ALL_MACOS: bash {project}/scripts/build_openssl.sh
          CIBW_BEFORE_ALL_WINDOWS: powershell -ExecutionPolicy Bypass -File {project}\scripts\build_openssl_windows.ps1

          CIBW_ENVIRONMENT_LINUX: >
            OPENSSL_DIR=$PWD/scripts/openssl-build/install
            PKG_CONFIG_PATH=$PWD/scripts/openssl-build/install/lib64/pkgconfig:$PWD/scripts/openssl-build/install/lib/pkgconfig
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            OPENSSL_DIR=$PWD/scripts/openssl-build/install
            PKG_CONFIG_PATH=$PWD/scripts/openssl-build/install/lib/pkgconfig
          CIBW_TEST_COMMAND: pip install pytest && pytest {project}/tests
          CIBW_BUILD_VERBOSITY: 1

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
        run: cibuildwheel --output-dir dist

      - name: Check wheels
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: build-wheels
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish-to-pypi == 'true'

    environment:
      name: pypi
      url: https://pypi.org/project/alkindi/

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-24.04
    needs: build-wheels
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish-to-testpypi == 'true'

    environment:
      name: testpypi
      url: https://test.pypi.org/project/alkindi/

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
